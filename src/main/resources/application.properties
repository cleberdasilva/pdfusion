spring.application.name=pdfusion

# Allow large PDF uploads (adjust as needed)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=500MB

# Logging
logging.level.com.pdfusion=INFO

# Static resources — include the img/ classpath folder alongside the defaults
spring.web.resources.static-locations=classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/,classpath:/img/
